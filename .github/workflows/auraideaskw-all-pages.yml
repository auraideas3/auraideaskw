name: Apply reference design to all pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_all_pages.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download all-pages package
        run: curl -L --fail --retry 3 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663861390937/AspVoxzaaqPENyag.zip' -o /tmp/aura-all-pages.zip
      - name: Apply all-page reference design
        run: |
          rm -rf /tmp/aura-all-pages
          mkdir -p /tmp/aura-all-pages
          unzip -q /tmp/aura-all-pages.zip -d /tmp/aura-all-pages
          rsync -a /tmp/aura-all-pages/ ./
          rm -f .github/workflows/apply_all_pages.yml
      - name: Commit and push
        run: |
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Restore reference design across all Kuwait pages'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
