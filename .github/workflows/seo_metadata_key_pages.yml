name: Improve SEO metadata on key Kuwait pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo_metadata_key_pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Add page-specific SEO metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html import escape
          pages = {
              'about/index.html': ('من نحن | أورا للأفكار في الكويت', 'أورا للأفكار منصة كويتية للدعم الأكاديمي والبحثي للطلاب والباحثين، من تنظيم الأبحاث إلى الرسائل والتحليل والتدقيق.', 'https://www.auraideaskw.com/about/'),
              'guarantees/index.html': ('ضمانات الجودة الأكاديمية | أورا للأفكار', 'تعرف على منهجية أورا للأفكار في تنظيم الدعم الأكاديمي والبحثي للطلاب والباحثين في الكويت.', 'https://www.auraideaskw.com/guarantees/'),
              'books/index.html': ('كتب وأدلة أكاديمية | أورا للأفكار في الكويت', 'كتب وأدلة مختارة تساعد الطلاب والباحثين في الكويت على تنظيم البحث والكتابة والتوثيق والعروض الأكاديمية.', 'https://www.auraideaskw.com/books/'),
              'جامعات-الكويت/index.html': ('جامعات الكويت | دليل أكاديمي للطلاب والباحثين', 'دليل جامعات الكويت ومتطلباتها الأكاديمية، مع دعم لتنظيم الأبحاث والمشاريع حسب الجامعة والتخصص.', 'https://www.auraideaskw.com/جامعات-الكويت/'),
              'تواصل-معنا/index.html': ('تواصل معنا | أورا للأفكار في الكويت', 'تواصل مع أورا للأفكار للحصول على دعم أكاديمي وبحثي للطلاب والباحثين في الكويت عبر واتساب.', 'https://www.auraideaskw.com/تواصل-معنا/'),
              'خدماتنا/index.html': ('خدمات أكاديمية وبحثية في الكويت | أورا للأفكار', 'خدمات أورا للأفكار للطلاب والباحثين في الكويت: الأبحاث الجامعية، الماجستير والدكتوراه، التحليل الإحصائي، التدقيق والعروض.', 'https://www.auraideaskw.com/خدماتنا/'),
          }
          verification = 'Y1_tns68j0XSbDUUFEqeQJGmR7WTLcCdA66Koav-d1c'
          for filename, (title, description, canonical) in pages.items():
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              import re
              s = re.sub(r'<title>.*?</title>', f'<title>{escape(title)}</title>', s, count=1, flags=re.S|re.I)
              tags = f'''\n<meta name="description" content="{escape(description)}">\n<meta name="robots" content="index,follow,max-image-preview:large">\n<link rel="canonical" href="{canonical}">\n<meta property="og:title" content="{escape(title)}">\n<meta property="og:description" content="{escape(description)}">\n<meta property="og:url" content="{canonical}">\n<meta name="google-site-verification" content="{verification}">\n'''
              s = re.sub(r'<meta name="description"[^>]*>\s*', '', s, count=1, flags=re.I)
              s = re.sub(r'<meta name="robots"[^>]*>\s*', '', s, count=1, flags=re.I)
              s = re.sub(r'<link rel="canonical"[^>]*>\s*', '', s, count=1, flags=re.I)
              s = s.replace('</head>', tags + '</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/seo_metadata_key_pages.yml
      - name: Commit and push
        run: |
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Improve SEO metadata for Kuwait reference pages'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove completed workflow
        if: always()
        run: |
          git rm -f .github/workflows/seo_metadata_key_pages.yml || true
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Remove completed SEO workflow'
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
