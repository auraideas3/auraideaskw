name: Validate SEO artifacts
on:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'sitemap_index.xml'
      - 'robots.txt'
      - 'build_sitemap.py'
      - 'audit_seo.py'
      - '.github/workflows/validate_seo.yml'
  pull_request:
    paths:
      - 'sitemap.xml'
      - 'sitemap_index.xml'
      - 'robots.txt'
      - 'build_sitemap.py'
      - 'audit_seo.py'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install audit dependency
        run: python -m pip install beautifulsoup4
      - name: Validate sitemap and indexability
        run: |
          python build_sitemap.py
          python audit_seo.py
          test "$(grep -c '<loc>http' sitemap_index.xml)" -eq 1
          ! grep -q '<loc>/\|�\|╪\|┘' sitemap.xml sitemap_index.xml
