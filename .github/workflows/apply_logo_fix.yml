name: Apply logo SEO fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_logo_fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download logo fix package
        run: curl -L --fail --retry 3 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663861390937/dAAgWttNaJcchKqz.zip' -o /tmp/logo-fix.zip
      - name: Apply logo fix package
        run: |
          rm -rf /tmp/logo-fix
          mkdir -p /tmp/logo-fix
          unzip -q /tmp/logo-fix.zip -d /tmp/logo-fix
          rsync -a --exclude='.git/' /tmp/logo-fix/ ./
          rm -f .github/workflows/apply_logo_fix.yml
      - name: Commit and push
        run: |
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Fix logo and favicon SEO assets'
          git push
