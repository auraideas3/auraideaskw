name: Fix homepage service links

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix_home_service_links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Replace legacy service links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts or '.backup-before-reference-all-pages' in path.parts:
                  continue
              try:
                  source = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = source.replace('href="/services/"', 'href="/خدماتنا/"').replace("href='/services/'", "href='/خدماتنا/'")
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Fix legacy service links'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove completed workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix_home_service_links.yml || true
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Remove completed service link workflow'
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
