name: Apply natural SEO queries

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_natural_seo.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download prepared SEO package
        run: curl -L --fail --retry 3 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663861390937/DjJosSzbqKxbKwBT.zip' -o /tmp/natural-seo.zip
      - name: Apply prepared SEO package
        run: |
          rm -rf /tmp/natural-seo
          mkdir -p /tmp/natural-seo
          unzip -q /tmp/natural-seo.zip -d /tmp/natural-seo
          rsync -a --exclude='.git/' /tmp/natural-seo/ ./
          rm -f .github/workflows/apply_natural_seo.yml
      - name: Commit and push
        run: |
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Add natural Kuwait student search queries'
          git push
