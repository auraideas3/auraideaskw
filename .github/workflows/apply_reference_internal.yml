name: Apply original reference internal pages
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_reference_internal.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download reference pages package
        run: curl -L --fail --retry 3 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663861390937/kSUVPxpdQKxxdRUy.zip' -o /tmp/reference-internal-pages.zip
      - name: Apply original reference pages
        run: |
          rm -rf /tmp/reference-internal-pages
          mkdir -p /tmp/reference-internal-pages
          unzip -q /tmp/reference-internal-pages.zip -d /tmp/reference-internal-pages
          cp /tmp/reference-internal-pages/index-X0vKiwQH.css ./index-X0vKiwQH.css
          cp /tmp/reference-internal-pages/about/index.html ./about/index.html
          cp /tmp/reference-internal-pages/guarantees/index.html ./guarantees/index.html
          cp /tmp/reference-internal-pages/books/index.html ./books/index.html
          mkdir -p ./تواصل-معنا ./خدماتنا
          cp /tmp/reference-internal-pages/تواصل-معنا/index.html ./تواصل-معنا/index.html
          cp /tmp/reference-internal-pages/خدماتنا/index.html ./خدماتنا/index.html
          rm -f .github/workflows/apply_reference_internal.yml
      - name: Commit and push
        run: |
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Apply original Vercel reference internal pages'
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
