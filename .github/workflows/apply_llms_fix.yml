name: Apply Kuwait AI discovery file

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply_llms_fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download corrected llms file
        run: curl -L --fail --retry 3 'https://files.manuscdn.com/user_upload_by_module/session_file/310519663861390937/GCzqOQIMhZfJfeNU.zip' -o /tmp/llms-fix.zip
      - name: Apply corrected llms file
        run: |
          unzip -q /tmp/llms-fix.zip -d /tmp/llms-fix
          cp /tmp/llms-fix/llms.txt ./llms.txt
          rm -f .github/workflows/apply_llms_fix.yml
      - name: Commit and push
        run: |
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Fix Kuwait AI discovery metadata'
          git push
