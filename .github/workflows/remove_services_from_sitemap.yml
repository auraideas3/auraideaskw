name: Remove legacy services URL from sitemap

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove_services_from_sitemap.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove legacy services URL
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<url><loc>https://www\.auraideaskw\.com/services/</loc></url>', '', s)
          p.write_text(s, encoding='utf-8')
          print('legacy services URL removed from sitemap')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git add sitemap.xml
          git commit -m 'Remove legacy services URL from sitemap'
          git push
      - name: Remove one-time workflow
        if: always()
        shell: bash
        run: |
          git rm -f .github/workflows/remove_services_from_sitemap.yml || true
          git config user.name 'auraideas3'
          git config user.email 'auraideas3@users.noreply.github.com'
          git commit -m 'Remove one-time sitemap cleanup workflow' || true
          git push || true
